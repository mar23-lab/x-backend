# Isolated commercial-validation environment. This Worker never owns api.xlooop.com.
name = "xlooop-api-pilot-shadow"
main = "src/workers/index.ts"
compatibility_date = "2026-06-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true
routes = [
  { pattern = "api-test.xlooop.com", custom_domain = true }
]

[triggers]
crons = ["*/5 * * * *"]

[[queues.producers]]
binding = "TENANT_PROJECTION_QUEUE"
queue = "xlooop-tenant-projection-pilot-shadow"

[[queues.consumers]]
queue = "xlooop-tenant-projection-pilot-shadow"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[ai]
binding = "AI"

[[services]]
binding = "EXTERNAL_CAPABILITY_ADAPTER"
service = "xlooop-capability-adapter-pilot-shadow"

[vars]
ENVIRONMENT = "pilot-shadow"
XLOOOP_AUTHORITY_MODE = "shadow"
XLOOOP_SCHEMA_HEAD = "101"
ALLOWED_ORIGIN_PATTERN = "https://test.xlooop.com,https://*.xlooop-test.pages.dev"
CLERK_AUTHORIZED_PARTIES = "https://test.xlooop.com"
LOG_LEVEL = "info"
MARKITDOWN_ADAPTER_ENABLED = "false"
HEADROOM_COMPRESSION_ENABLED = "false"
EXTERNAL_CAPABILITY_TENANT_REFS = ""

# Commercial candidate paths are active only inside this isolated environment.
SINGLE_INTAKE_ENABLED = "true"
ROLE_SKILL_RESOLVER_ENABLED = "true"
ROLE_SKILL_CATALOG_ENABLED = "true"
CONTEXT_PACKET_PERSISTENCE_ENABLED = "true"
CHAT_HISTORY_PERSISTENCE_REQUIRED = "true"
IDEMPOTENCY_ENABLED = "true"
SOURCE_SCOPE_ENFORCEMENT_ENABLED = "true"
# Read-only customer connector tokens are enabled in this isolated environment so the
# Settings API-access journey can prove mint -> session start -> revocation. Operational
# tokens remain explicitly off until their separate write-authority proof is approved.
CUSTOMER_API_TOKENS_ENABLED = "true"
CUSTOMER_OPERATIONAL_TOKENS_ENABLED = "false"
# Customer onboarding must exercise the same governed first-session path as the
# commercial runtime. The approver identity remains a write-only Worker secret
# checked by deploy-pilot-shadow.mjs; no operator identifier is committed here.
CUSTOMER_AUTO_PROVISION_ON_SESSION = "true"
CUSTOMER_AUTO_PROVISION_FROM_CLERK_ORG = "true"
CUSTOMER_INAPP_READINESS_GATE = "true"
# Stays disabled until migration 101, the dedicated keyring, Google OAuth app,
# and test.xlooop.com callback are all live-proven in this isolated environment.
CONNECTOR_OAUTH_AUTHORITY_MODE = "disabled"
CONNECTOR_OAUTH_REDIRECT_URI = "https://test.xlooop.com/settings/integrations"
CONNECTOR_GOOGLE_OAUTH_VERIFICATION_STATUS = "pilot_test_users"
TENANT_PROJECTION_QUEUE_ENABLED = "true"
CURRENT_WORK_PROJECTION_ENABLED = "true"
GRAPH_DOCUMENT_NODES_ENABLED = "true"
CUSTOMER_SAFE_SERIALIZER_ENABLED = "true"
CHAT_SOURCE_TRUTH_OVERRIDE_ENABLED = "true"
CHAT_ROLE_SCOPED_CONTEXT_ENABLED = "true"
CHAT_GRAPH_CONTEXT_ENABLED = "true"
DOCUMENT_READ_AUDIT_ENABLED = "true"
SPINE_TOOL_EVENT_UNIFICATION_ENABLED = "true"
PACKET_INTENT_QUALITY_ENABLED = "true"
OPERATOR_WORKSPACE_SCOPE_ENABLED = "true"

# Autonomous and production-authority effects remain inert during evidence collection.
EXECUTOR_MODE = "disabled"
DIGEST_SWEEP_ENABLED = "false"
RECLASSIFY_CRON_ENABLED = "false"
ENTITLEMENT_ENFORCEMENT = "off"
PURGE_DELETED_ENABLED = "false"

[observability]
enabled = true
head_sampling_rate = 1.0
