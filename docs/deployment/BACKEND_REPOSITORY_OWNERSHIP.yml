# BACKEND_REPOSITORY_OWNERSHIP.yml · Wave C0.5 (260713) · machine-readable repository-authority SSOT
# for the backend cutover program. Human narrative + gate register: BACKEND_REPOSITORY_CUTOVER_PREFLIGHT.md.
# Governance boundary rows live in MB-P BOUNDARY_MATRIX.yml (this file POINTS at them, never mirrors values).
schema_id: xlooop.backend_repository_ownership.v1
updated: "2026-07-13"

authority:
  # CORRECTED 260727. This read `Xlooop-XCP-demo` and had been frozen since 0714 while x-backend was
  # demonstrably the deployer — so an agent trusting this machine-readable field got the wrong answer.
  # Evidence: production /health build 3d7ade27e75146ba6704bc2864d0362a80b2bba9 resolves in x-backend
  # and is NOT a commit in Xlooop-XCP-demo at all (git cat-file -e -> NOT_IN_DEMO); the donor tip is
  # frozen at 67a9b51c (0718). The cutover happened in fact before it happened in this file.
  deploy_authority: x-backend                # ACTUAL deployer since the ~260719 cutover (measured 260727)
  deploy_authority_prior: Xlooop-XCP-demo    # donor; still carries a same-target config — see hazard
  deploy_authority_hazard: |
    Xlooop-XCP-demo/wrangler.toml STILL declares name = "xlooop-api" and
    [[routes]] pattern = "api.xlooop.com", with a deploy:api that has NO RLS/schema/authority
    preflights and stamps only the 8-char sha. Running it from the frozen donor would overwrite
    production and regress provenance. It is read-only by POLICY, not by MECHANISM.
    OPEN 260727: neutralise that route/name in the donor. Not done here — the donor is a separate
    frozen repo needing its own claim and PR.
  shadow_repo: x-backend                     # github.com/mar23-lab/x-backend · empty until GATE-SEED-PUSH
  frontend_repo: x-ai-front                  # consumes the API by contract pin, never by source import
  docs_repo: x-ai-docs                       # canonical cross-repo ADRs/runbooks (DOC_DISPOSITION_LEDGER routes)
  transfer_trigger_ssot: "MB-P ECOSYSTEM_MANIFEST.yaml (operator freeze declaration + Parity Sentinel green 7d, ABS-P6)"

deploy_surfaces:
  api_worker:
    name: xlooop-api
    domain: api.xlooop.com
    # LIVE receipt, rewritten by every deploy. Gitignored via .gitignore:81
    # (`latest-*-deploy-receipt.json`) — deliberate and load-bearing, see receipt_path_history.
    receipt: docs/deployment/evidence/latest-cloudflare-api-deploy-receipt.json
    receipt_rule: "emit-deploy-receipt.mjs refuses unless live /health build == local HEAD"
    receipt_seed_snapshot: docs/deployment/evidence/cloudflare-api-deploy-receipt.json
    receipt_path_history: >-
      Until 260727 the emitter wrote the LIVE receipt to
      docs/deployment/evidence/cloudflare-api-deploy-receipt.json, which is blob-pinned as
      immutable donor-seed evidence in MIGRATION-PROVENANCE.json (.files[194]). That file is
      frozen by contract while the receipt is rewritten by every deploy — two contradictory
      requirements on one path. The contradiction stayed invisible for 14 days because the
      receipt_rule was never chained into deploy:api, so nothing ever wrote the file; the first
      real deploy after chaining it turned verify:provenance, and so ci-local, RED. The pinned
      file is restored to its exact seed blob and kept as a historical snapshot; the live receipt
      moved to the gitignored latest-* path, matching how pages_app is already handled.
      .gitignore:77-79 records a third independent reason receipts must not be committed: a
      committed receipt records the PRE-commit HEAD, creating a source_commit feedback loop.
  pages_app:
    name: xlooop-app
    domain: app.xlooop.com
    receipt: docs/deployment/evidence/latest-cloudflare-prod-deploy-receipt.json

contract:
  producer_artifact: docs/contracts/api-contract.v1.json     # generated; drift gate verify:contract
  producer_generator: scripts/emit-api-contract.mjs
  route_emitter: scripts/emit-routes-manifest.mjs            # stamps contract_version + contract_hash
  consumer_pin: x-ai-front/wired/scripts/backend-routes.snapshot.json
  consumer_validators: [verify-wired-routes-resolve.mjs, verify-mock-envelope-parity.mjs]

boundary_gates:
  - id: verify:import-ban
    script: scripts/verify-frontend-worker-import-ban.mjs
    asserts: "no frontend->workers imports; contract-types byte-synced to workers/dal/types (4 files)"
  - id: verify:contract
    script: scripts/verify-api-contract-artifact.mjs
    asserts: "committed api-contract.v1.json == regeneration (byte)"

seed:
  method: "manifest fresh-copy + git ls-tree blob-hash provenance (MIGRATION-PROVENANCE.md)"
  base_manifest: docs/deployment/BACKEND_SURFACE_MANIFEST_260711H.md
  delta_annex: docs/deployment/BACKEND_SURFACE_MANIFEST_DELTA_260713.md
  rehearsal_receipt: docs/deployment/SEED_REHEARSAL_RECEIPT_260711I.md
  gate_fork_ledger: docs/deployment/GATE_DISPOSITION_LEDGER_260711H.md
  freeze_protocol: docs/deployment/FREEZE_PROTOCOL_260711H.md

operator_gates:
  - GATE-SEED-METHOD
  - GATE-BOUNDARY-AMEND-XB-SHADOW
  - GATE-SEED-SHA
  - GATE-SEED-PUSH
  - GATE-NEON-BRANCH
  - GATE-SHADOW-SECRETS
  - GATE-SHADOW-DEPLOY-1
  - GATE-FLIP
  - GATE-CANONICAL-CLAIM
